<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Factory Dashboard</title>

  <!-- Chart.js & Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-gauge@4.1.0/dist/chartjs-chart-gauge.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.5.1/dist/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f8f8;
    }

    h1 {
      margin-top: 20px;
    }

    .gauge-container {
      width: 300px;
      display: inline-block;
      margin: 20px;
    }

    #chartContainer {
      width: 80%;
      margin: 30px auto;
    }
  </style>
</head>
<body>
  <h1>Smart Factory Dashboard</h1>

  <div class="gauge-container">
    <h3>Temperature</h3>
    <canvas id="tempGauge"></canvas>
  </div>

  <div class="gauge-container">
    <h3>Humidity</h3>
    <canvas id="humGauge"></canvas>
  </div>

  <div id="chartContainer">
    <canvas id="pmChart"></canvas>
  </div>

  <script>
    const socket = io.connect('http://localhost:5000'); // เปลี่ยน URL ให้ตรงกับ server จริง

    // Gauge - Temperature
    const tempGauge = new Chart(document.getElementById('tempGauge'), {
      type: 'gauge',
      data: {
        datasets: [{
          value: 0,
          data: [0, 10, 20, 30, 40, 50],
          backgroundColor: ['green', 'yellowgreen', 'yellow', 'orange', 'red'],
        }]
      },
      options: {
        responsive: true,
        needle: {
          radiusPercentage: 2,
          widthPercentage: 3.2,
          lengthPercentage: 80,
          color: 'black'
        },
        valueLabel: {
          formatter: (value) => value.toFixed(1) + " °C",
          display: true
        }
      }
    });

    // Gauge - Humidity
    const humGauge = new Chart(document.getElementById('humGauge'), {
      type: 'gauge',
      data: {
        datasets: [{
          value: 0,
          data: [0, 20, 40, 60, 80, 100],
          backgroundColor: ['blue', 'skyblue', 'lime', 'yellow', 'orange']
        }]
      },
      options: {
        responsive: true,
        needle: {
          radiusPercentage: 2,
          widthPercentage: 3.2,
          lengthPercentage: 80,
          color: 'black'
        },
        valueLabel: {
          formatter: (value) => value.toFixed(1) + " %",
          display: true
        }
      }
    });

    // PM2.5 Line Chart
    const pmCtx = document.getElementById('pmChart').getContext('2d');
    const pmChart = new Chart(pmCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'PM2.5 (µg/m³)',
          data: [],
          borderColor: 'rgb(255, 99, 132)',
          fill: false,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: 'time',
            time: {
              tooltipFormat: 'HH:mm:ss',
              unit: 'second'
            },
            title: { display: true, text: 'Time' }
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: 'PM2.5 (µg/m³)' }
          }
        },
        plugins: {
          title: { display: true, text: 'PM2.5 Real-Time Graph' }
        }
      }
    });

    // รับข้อมูลจาก socket.io
    socket.on('sensor_update', (data) => {
      const temp = parseFloat(data.temperature || 0);
      const hum = parseFloat(data.humidity || 0);
      const pm = parseFloat(data.pm || 0);
      const now = new Date();

      // อัปเดต gauge
      tempGauge.data.datasets[0].value = temp;
      humGauge.data.datasets[0].value = hum;
      tempGauge.update();
      humGauge.update();

      // อัปเดตกราฟ PM2.5
      pmChart.data.labels.push(now);
      pmChart.data.datasets[0].data.push(pm);

      // จำกัดข้อมูลที่แสดง
      if (pmChart.data.labels.length > 50) {
        pmChart.data.labels.shift();
        pmChart.data.datasets[0].data.shift();
      }

      pmChart.update();
    });
  </script>
</body>
</html>
